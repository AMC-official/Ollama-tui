version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: ollama-tui
    env:
      - CGO_ENABLED=0 # Safest for cross-compilation on Ubuntu runners
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      # - arm64  <-- We are removing arm64 because Ubuntu can't build CGO for it natively.

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Use format_overrides instead of the deprecated top-level format
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE
      - install.sh
      - install.ps1
