version: 2

project_name: ollama-tui

before:
  hooks:
    - go mod tidy

builds:
  - id: posix
    main: .
    binary: ollama-tui
    env:
      - CGO_ENABLED=1
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

  - id: windows
    main: .
    binary: ollama-tui
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: posix-archive
    builds:
      - posix
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_linux_bsd_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - install.sh

  - id: windows-archive
    builds:
      - windows
    format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_windows_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - install.ps1
